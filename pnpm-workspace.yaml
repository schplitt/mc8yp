  '@iso4/fetch': ^0.0.1
  '@iso4/sandbox': ^0.4.2
  '@napi-rs/keyring': ^1.3.0
  '@schplitt/eslint-config': ^1.5.3
  '@tmcp/adapter-valibot': ^0.1.6
  '@tmcp/session-manager': ^0.3.0
  '@tmcp/transport-http': ^0.9.0
  '@tmcp/transport-stdio': ^0.5.0
  '@toon-format/toon': ^4.1.1
  '@types/node': ^25.9.5
  bumpp: ^12.2.2
  changelogithub: ^15.0.5
  citty: ^0.2.2
  consola: ^3.4.2
  eslint: ^10.9.1
  h3: 2.0.1-rc.22
  just-bash: ^3.4.2
  minisearch: ^7.2.0
  srvx: ^0.12.7
  tmcp: ^1.20.0
  tsdown: ^0.22.14
  typescript: ^6.0.3
  ufo: ^1.6.4
  valibot: ^1.4.2
  vitest: ^4.1.11

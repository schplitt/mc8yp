catalogMode: prefer

minimumReleaseAgeExclude:
  - '@iso4/*'
shellEmulator: true

blockExoticSubdeps: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - cached-factory@0.1.0
  - undici-types@6.21.0
  - tinyexec@1.2.2
  - '@iso4/*'

catalog:
  '@apidevtools/json-schema-ref-parser': ^16.0.5
  '@c8y/client': ^1024.22.10
  '@clack/prompts': ^1.8.1
  '@iso4/fetch': ^0.1.1
  '@iso4/sandbox': ^0.9.0
  '@napi-rs/keyring': ^2.1.2
  '@schplitt/eslint-config': ^1.5.4
  '@tmcp/adapter-valibot': ^0.1.7
  '@tmcp/session-manager': ^0.3.1
  '@tmcp/transport-http': ^0.9.1
  '@tmcp/transport-stdio': ^0.5.1
  '@toon-format/toon': ^4.4.0
  '@types/node': ^26.6.6
  bumpp: ^12.3.0
  changelogithub: ^15.0.5
  citty: ^0.2.2
  consola: ^3.4.2
  eslint: ^10.14.0
  h3: ^2.0.8
  just-bash: ^3.6.0
  minisearch: ^7.2.0
  srvx: ^1.0.8
  tmcp: ^1.20.1
  tsdown: ^0.23.5
  typescript: ^6.0.3
  ufo: ^1.6.4
  valibot: ^1.5.0
  vitest: ^5.1.0
allowBuilds:
  '@mongodb-js/zstd': false
  node-liblzma: false
